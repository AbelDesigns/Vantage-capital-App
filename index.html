<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vantage Capital — Private Wealth &amp; Global Treasury App</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- GSAP 3.13 Core for fluid app choreography & 3D micro-interactions -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Satoshi', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            obsidian: '#08080A',
            surface: '#111114',
            elevated: '#18181D',
            subtle: '#222228',
            vantage: '#F2CE16',
            'vantage-dim': '#D4B30D',
            ink: '#F5F5F7',
            muted: '#8E8E93',
            faint: '#52525B',
            gain: '#30D158',
            loss: '#FF453A',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-obsidian text-ink font-sans selection:bg-vantage selection:text-obsidian">

  <!-- External Stage Bar (Only visible when inspecting Mobile Artboard on Desktop) -->
  <div id="preview-stage-bar" class="hidden w-full max-w-[390px] mx-auto pt-4 px-1 items-center justify-between text-[12px]">
    <div class="flex items-center gap-2 text-muted">
      <span class="w-1.5 h-1.5 rounded-full bg-vantage animate-pulse"></span>
      <span class="font-bold text-ink">Vantage iOS Preview</span>
      <span class="text-faint tabular-nums">390 × 812</span>
    </div>
    <button id="exit-mobile-preview-btn" class="tactile flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface hairline hover:border-vantage/45 text-ink font-medium">
      <i data-lucide="monitor" class="w-3.5 h-3.5 text-vantage"></i>
      <span>Volver a Web</span>
    </button>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="min-h-screen flex flex-col lg:flex-row app-ambient-canvas relative">

    <!-- Desktop Sidebar -->
    <aside id="desktop-sidebar" class="sidebar-enter hidden lg:flex lg:flex-col lg:w-64 lg:shrink-0 bg-surface/95 backdrop-blur-xl border-r border-white/[0.07] justify-between p-5 sticky top-0 h-screen">
      <div class="flex flex-col gap-7">
        <!-- Brand Mark (Clean logo without bubble, matching Landing Page) -->
        <button id="brand-home-btn" class="flex items-center gap-3 px-1 text-left group focus:outline-none">
          <svg width="24" height="18" viewBox="0 0 221 167" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0 transition-transform duration-300 group-hover:scale-105">
            <path d="M0 0L110.109 166.858L127.539 141.473L32.7384 0C32.7384 0 0 0.242599 0 0Z" fill="#F2CE16"/>
            <path d="M110.109 101.493L127.545 76.2321L76.2324 0H43.2451L110.109 101.493Z" fill="#F2CE16"/>
            <path d="M115.195 44.7073L131.611 69.3921L177.767 0.487793H145.029L115.195 44.7073Z" fill="#F2CE16"/>
            <path d="M187.654 0L115.571 108.977L131.477 133.162L220.15 0H187.654Z" fill="#F2CE16"/>
            <path d="M109.937 21.7641C116.101 21.7641 121.098 16.8921 121.098 10.8821C121.098 4.87207 116.101 0 109.937 0C103.773 0 98.7759 4.87207 98.7759 10.8821C98.7759 16.8921 103.773 21.7641 109.937 21.7641Z" fill="#F2CE16"/>
          </svg>
          <div class="flex flex-col">
            <span class="text-[15px] font-bold tracking-tight text-ink leading-none">Vantage Capital</span>
            <span class="text-[10px] font-bold uppercase tracking-[0.14em] text-vantage/85 mt-1 leading-none">Private Wealth</span>
          </div>
        </button>

        <!-- Primary Navigation -->
        <nav class="flex flex-col gap-1" aria-label="Navegación principal">
          <button data-nav="overview" class="nav-item sidebar-nav-stagger tactile flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] font-medium text-left">
            <span class="flex items-center gap-3"><i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i><span>Resumen</span></span>
            <span class="nav-active-dot w-1.5 h-1.5 rounded-full bg-vantage opacity-0 transition-opacity"></span>
          </button>
          <button data-nav="transfer" class="nav-item sidebar-nav-stagger tactile flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] font-medium text-left">
            <span class="flex items-center gap-3"><i data-lucide="arrow-left-right" class="w-4 h-4 shrink-0"></i><span>Transferencias</span></span>
            <span class="nav-active-dot w-1.5 h-1.5 rounded-full bg-vantage opacity-0 transition-opacity"></span>
          </button>
          <button data-nav="portfolio" class="nav-item sidebar-nav-stagger tactile flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] font-medium text-left">
            <span class="flex items-center gap-3"><i data-lucide="pie-chart" class="w-4 h-4 shrink-0"></i><span>Portafolio</span></span>
            <span class="nav-active-dot w-1.5 h-1.5 rounded-full bg-vantage opacity-0 transition-opacity"></span>
          </button>
          <button data-nav="analytics" class="nav-item sidebar-nav-stagger tactile flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] font-medium text-left">
            <span class="flex items-center gap-3"><i data-lucide="activity" class="w-4 h-4 shrink-0"></i><span>Analítica</span></span>
            <span class="nav-active-dot w-1.5 h-1.5 rounded-full bg-vantage opacity-0 transition-opacity"></span>
          </button>
          <button data-nav="cards" class="nav-item sidebar-nav-stagger tactile flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] font-medium text-left">
            <span class="flex items-center gap-3"><i data-lucide="credit-card" class="w-4 h-4 shrink-0"></i><span>Tarjetas</span></span>
            <span class="nav-active-dot w-1.5 h-1.5 rounded-full bg-vantage opacity-0 transition-opacity"></span>
          </button>
          <button data-nav="settings" class="nav-item sidebar-nav-stagger tactile flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] font-medium text-left">
            <span class="flex items-center gap-3"><i data-lucide="sliders-horizontal" class="w-4 h-4 shrink-0"></i><span>Ajustes</span></span>
            <span class="nav-active-dot w-1.5 h-1.5 rounded-full bg-vantage opacity-0 transition-opacity"></span>
          </button>
        </nav>

        <!-- Luminous Copilot AI Trigger -->
        <div class="pt-4 border-t border-white/[0.06] flex flex-col gap-2">
          <button id="sidebar-copilot-btn" class="btn-glow group w-full !justify-between px-3 py-3 rounded-xl text-left">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-7 h-7 rounded-lg bg-vantage/15 border border-vantage/35 flex items-center justify-center text-vantage shrink-0 group-hover:bg-vantage group-hover:text-obsidian transition-colors">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
              </div>
              <div class="flex flex-col min-w-0">
                <span class="text-[13px] font-bold text-ink leading-tight truncate">Copilot AI</span>
                <span class="text-[11px] text-muted leading-tight truncate">Analizar tesorería</span>
              </div>
            </div>
            <span class="inline-flex items-center gap-0.5 text-[10px] font-bold text-ink/70 bg-obsidian/70 hairline px-1.5 py-0.5 rounded-md shrink-0 leading-none select-none">
              ⌘K
            </span>
          </button>
        </div>

        <!-- Treasury Status Pill -->
        <div class="bg-obsidian/70 hairline rounded-xl p-3 flex flex-col gap-2">
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-muted font-medium">Custodia Tier-1</span>
            <span class="inline-flex items-center gap-1 text-gain font-bold">
              <span class="w-1.5 h-1.5 rounded-full bg-gain animate-pulse"></span>
              Activa
            </span>
          </div>
          <div class="text-[11px] text-faint leading-snug">
            FedNow, SEPA Instant y US Treasury T+1 operando sin demoras.
          </div>
        </div>
      </div>

      <!-- Account Footer -->
      <div class="flex flex-col gap-2 pt-4 border-t border-white/[0.06]">
        <button id="sidebar-profile-btn" class="tactile flex items-center gap-3 px-2 py-2 rounded-xl hover:bg-white/[0.03] text-left">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-vantage/30 to-subtle hairline-gold flex items-center justify-center text-[11px] font-bold text-vantage shrink-0">
            AM
          </div>
          <div class="flex flex-col min-w-0 flex-1">
            <span class="text-[13px] font-bold text-ink truncate">Alejandro Morales</span>
            <span class="text-[11px] text-muted truncate">Private Wealth ••8841</span>
          </div>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-faint"></i>
        </button>
      </div>
    </aside>

    <!-- Main Column -->
    <div id="main-column" class="flex-1 flex flex-col min-w-0">

      <!-- Desktop Top Header -->
      <header id="desktop-header" class="header-enter hidden lg:flex sticky top-0 z-30 bg-obsidian/85 backdrop-blur-xl border-b border-white/[0.06] px-8 h-16 items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <h1 id="header-page-title" class="text-[16px] font-bold tracking-tight text-ink truncate">Resumen</h1>

          <!-- Live Market Ticker (Desktop xl+) -->
          <div class="hidden xl:flex items-center gap-4 ml-4 pl-4 border-l border-white/[0.08] text-[12px] tabular-nums">
            <span class="inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-muted">
              <span class="w-1.5 h-1.5 rounded-full bg-gain animate-pulse"></span>Live
            </span>
            <div class="flex items-center gap-1.5">
              <span class="text-muted">S&amp;P 500</span>
              <span id="tick-spx" class="text-ink font-semibold">5,846.80</span>
              <span class="text-gain font-medium">+0.42%</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-muted">US 3M</span>
              <span id="tick-tbill" class="text-ink font-semibold">4.92%</span>
              <span class="text-vantage font-medium">APY</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-muted">EUR/USD</span>
              <span id="tick-eur" class="text-ink font-semibold">1.0800</span>
              <span class="text-faint">Mid</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button id="viewport-toggle-btn" title="Inspeccionar App Móvil (390px)" class="tactile flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface hairline hover:border-vantage/40 text-[12px] font-medium text-muted hover:text-ink">
            <i data-lucide="smartphone" class="w-3.5 h-3.5 text-vantage"></i>
            <span>Vista App</span>
          </button>

          <button id="privacy-toggle-btn" title="Ocultar / mostrar saldos" class="tactile w-9 h-9 rounded-xl bg-surface hairline hover:border-white/25 flex items-center justify-center text-muted hover:text-ink">
            <i id="privacy-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>

          <button id="header-copilot-btn" title="Abrir Vantage Copilot (⌘K)" class="tactile flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface hairline hover:border-vantage/45 text-[12px] font-bold text-ink">
            <span class="w-1.5 h-1.5 rounded-full bg-vantage"></span>
            <span>Copilot</span>
          </button>

          <button id="header-deposit-btn" class="tactile flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-vantage text-obsidian text-[12px] font-bold hover:bg-[#f7d83b] shadow-[0_0_24px_-6px_rgba(242,206,22,0.55)]">
            <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[2.5]"></i>
            <span>Depositar</span>
          </button>
        </div>
      </header>

      <!-- Native Mobile Top Bar (Clean logo without bubble) -->
      <header id="mobile-header" class="flex lg:hidden sticky top-0 z-30 bg-obsidian/90 backdrop-blur-xl border-b border-white/[0.06] px-4 h-14 items-center justify-between gap-3 shrink-0">
        <button id="mobile-brand-btn" class="tactile flex items-center gap-2.5 min-w-0">
          <svg width="20" height="15" viewBox="0 0 221 167" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
            <path d="M0 0L110.109 166.858L127.539 141.473L32.7384 0C32.7384 0 0 0.242599 0 0Z" fill="#F2CE16"/>
            <path d="M110.109 101.493L127.545 76.2321L76.2324 0H43.2451L110.109 101.493Z" fill="#F2CE16"/>
            <path d="M115.195 44.7073L131.611 69.3921L177.767 0.487793H145.029L115.195 44.7073Z" fill="#F2CE16"/>
            <path d="M187.654 0L115.571 108.977L131.477 133.162L220.15 0H187.654Z" fill="#F2CE16"/>
            <path d="M109.937 21.7641C116.101 21.7641 121.098 16.8921 121.098 10.8821C121.098 4.87207 116.101 0 109.937 0C103.773 0 98.7759 4.87207 98.7759 10.8821C98.7759 16.8921 103.773 21.7641 109.937 21.7641Z" fill="#F2CE16"/>
          </svg>
          <span id="mobile-page-title" class="text-[16px] font-bold tracking-tight text-ink truncate">Vantage</span>
        </button>

        <div class="flex items-center gap-2 shrink-0">
          <button id="mobile-privacy-btn" aria-label="Ocultar saldos" class="tactile w-9 h-9 rounded-full bg-surface hairline flex items-center justify-center text-muted hover:text-ink">
            <i id="mobile-privacy-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
          <button id="mobile-copilot-btn" aria-label="Abrir Vantage Copilot" class="tactile w-9 h-9 rounded-full bg-surface hairline-gold flex items-center justify-center relative">
            <i data-lucide="sparkles" class="w-4 h-4 text-vantage"></i>
            <span class="w-1.5 h-1.5 rounded-full bg-vantage absolute top-1.5 right-1.5 animate-pulse"></span>
          </button>
          <button id="mobile-settings-btn" aria-label="Perfil y ajustes" class="tactile w-9 h-9 rounded-full bg-elevated hairline flex items-center justify-center text-[11px] font-bold text-vantage">
            AM
          </button>
        </div>
      </header>

      <!-- Dynamic Screen Container -->
      <main id="main-content" class="flex-1 w-full max-w-[1180px] mx-auto px-4 lg:px-8 py-5 lg:py-7 pb-24 lg:pb-12">
        <!-- Rendered by app.js -->
      </main>

      <!-- Native Mobile Bottom Tab Bar -->
      <nav id="mobile-bottom-nav" class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-[#0B0B0E]/95 backdrop-blur-xl border-t border-white/[0.08] px-2 pt-2 pb-3 flex items-center justify-around shrink-0" aria-label="Navegación móvil">
        <button data-nav="overview" class="mobile-nav-item tactile flex flex-col items-center gap-1 min-w-[56px] py-1 rounded-xl text-[10px] font-medium">
          <i data-lucide="home" class="w-[19px] h-[19px]"></i>
          <span>Inicio</span>
        </button>
        <button data-nav="transfer" class="mobile-nav-item tactile flex flex-col items-center gap-1 min-w-[56px] py-1 rounded-xl text-[10px] font-medium">
          <i data-lucide="arrow-left-right" class="w-[19px] h-[19px]"></i>
          <span>Enviar</span>
        </button>
        <button data-nav="portfolio" class="mobile-nav-item tactile flex flex-col items-center gap-1 min-w-[56px] py-1 rounded-xl text-[10px] font-medium">
          <i data-lucide="pie-chart" class="w-[19px] h-[19px]"></i>
          <span>Portafolio</span>
        </button>
        <button data-nav="analytics" class="mobile-nav-item tactile flex flex-col items-center gap-1 min-w-[56px] py-1 rounded-xl text-[10px] font-medium">
          <i data-lucide="bar-chart-2" class="w-[19px] h-[19px]"></i>
          <span>Analítica</span>
        </button>
        <button data-nav="cards" class="mobile-nav-item tactile flex flex-col items-center gap-1 min-w-[56px] py-1 rounded-xl text-[10px] font-medium">
          <i data-lucide="credit-card" class="w-[19px] h-[19px]"></i>
          <span>Tarjetas</span>
        </button>
      </nav>
    </div>

    <!-- Vantage Copilot Drawer (Scoped inside #app-shell so Mobile Preview clips & aligns pixel-perfectly) -->
    <div id="copilot-backdrop" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-[3px] hidden opacity-0 sheet-backdrop">
      <div id="copilot-panel" class="fixed top-0 right-0 bottom-0 w-full max-w-md bg-surface border-l border-white/[0.08] flex flex-col translate-x-full sheet-panel shadow-2xl">
        <div class="copilot-grabber flex justify-center pt-2.5 pb-1 md:hidden">
          <span class="w-9 h-1 rounded-full bg-white/20"></span>
        </div>
        <!-- Drawer Header -->
        <div class="px-5 py-4 border-b border-white/[0.08] bg-gradient-to-r from-vantage/[0.06] via-transparent to-transparent flex items-center justify-between">
          <div class="flex items-center gap-3">
            <svg width="20" height="15" viewBox="0 0 221 167" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
              <path d="M0 0L110.109 166.858L127.539 141.473L32.7384 0C32.7384 0 0 0.242599 0 0Z" fill="#F2CE16"/>
              <path d="M110.109 101.493L127.545 76.2321L76.2324 0H43.2451L110.109 101.493Z" fill="#F2CE16"/>
              <path d="M115.195 44.7073L131.611 69.3921L177.767 0.487793H145.029L115.195 44.7073Z" fill="#F2CE16"/>
              <path d="M187.654 0L115.571 108.977L131.477 133.162L220.15 0H187.654Z" fill="#F2CE16"/>
              <path d="M109.937 21.7641C116.101 21.7641 121.098 16.8921 121.098 10.8821C121.098 4.87207 116.101 0 109.937 0C103.773 0 98.7759 4.87207 98.7759 10.8821C98.7759 16.8921 103.773 21.7641 109.937 21.7641Z" fill="#F2CE16"/>
            </svg>
            <div class="flex flex-col">
              <span class="text-[14px] font-bold text-ink leading-tight">Vantage Copilot AI</span>
              <span class="text-[11px] text-muted leading-tight">Inteligencia de tesorería en tiempo real</span>
            </div>
          </div>
          <button id="copilot-close-btn" class="tactile w-8 h-8 rounded-xl hover:bg-elevated flex items-center justify-center text-muted hover:text-ink">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Messages -->
        <div id="copilot-messages" class="flex-1 overflow-y-auto p-4 sm:p-5 flex flex-col gap-3.5"></div>

        <!-- Quick Prompts + Input -->
        <div class="p-4 border-t border-white/[0.08] bg-obsidian/70 flex flex-col gap-3">
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            <button data-copilot-prompt="rebalance" class="copilot-chip tactile shrink-0 px-2.5 py-1.5 rounded-lg bg-elevated hairline hover:border-vantage/45 text-[12px] text-muted hover:text-ink">Rebalanceo +0.85%</button>
            <button data-copilot-prompt="fx" class="copilot-chip tactile shrink-0 px-2.5 py-1.5 rounded-lg bg-elevated hairline hover:border-vantage/45 text-[12px] text-muted hover:text-ink">Exposición EUR/USD</button>
            <button data-copilot-prompt="risk" class="copilot-chip tactile shrink-0 px-2.5 py-1.5 rounded-lg bg-elevated hairline hover:border-vantage/45 text-[12px] text-muted hover:text-ink">Evaluar riesgo</button>
            <button data-copilot-prompt="summary" class="copilot-chip tactile shrink-0 px-2.5 py-1.5 rounded-lg bg-elevated hairline hover:border-vantage/45 text-[12px] text-muted hover:text-ink">Resumen mensual</button>
          </div>
          <form id="copilot-form" class="flex items-center gap-2">
            <input id="copilot-input" type="text" placeholder="Pregunta sobre tu portafolio o liquidez..." class="flex-1 bg-elevated hairline rounded-xl px-3.5 py-2.5 text-[13px] text-ink placeholder:text-faint focus:outline-none focus:border-vantage/55" />
            <button type="submit" class="tactile px-4 py-2.5 rounded-xl bg-vantage text-obsidian text-[13px] font-bold hover:bg-[#f7d83b] shrink-0">Enviar</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Generic Modal / Bottom Sheet Container -->
    <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-[3px] hidden items-center justify-center p-4 sheet-backdrop opacity-0">
      <div id="modal-card" class="w-full max-w-md bg-surface hairline-strong rounded-2xl overflow-hidden shadow-2xl transform translate-y-4 sm:translate-y-0 sm:scale-95 opacity-0 transition-all duration-200"></div>
    </div>

    <!-- Sonner-style Toast Container -->
    <div id="toast-container" class="fixed top-16 lg:top-auto lg:bottom-6 right-4 lg:right-6 left-4 lg:left-auto z-50 flex flex-col gap-2 pointer-events-none lg:max-w-sm"></div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
