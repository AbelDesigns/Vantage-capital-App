<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantage Capital App — Figma Export Desktop Artboards (1440px)</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Satoshi', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            obsidian: '#08080A',
            surface: '#111114',
            elevated: '#18181D',
            subtle: '#222228',
            vantage: '#F2CE16',
            'vantage-dim': '#D4B30D',
            ink: '#F5F5F7',
            muted: '#8E8E93',
            faint: '#52525B',
            gain: '#30D158',
            loss: '#FF453A',
          },
        },
      },
    };
  </script>
  <style>
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #040406;
      color: #F5F5F7;
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1, "ss01" 1;
    }
    .hairline { border: 1px solid rgba(255, 255, 255, 0.08); }
    .hairline-strong { border: 1px solid rgba(255, 255, 255, 0.14); }
    .hairline-gold { border: 1px solid rgba(242, 206, 22, 0.38); }
    .hero-balance-surface {
      background:
        radial-gradient(85% 95% at 100% 0%, rgba(242, 206, 22, 0.10) 0%, transparent 56%),
        linear-gradient(180deg, #131317 0%, #101013 100%);
    }
    .btn-glow {
      background: radial-gradient(120% 140% at 50% 100%, rgba(242, 206, 22, 0.28) 0%, rgba(242, 206, 22, 0.08) 60%, rgba(17, 17, 20, 0.94) 100%);
      border: 1px solid rgba(242, 206, 22, 0.45);
      box-shadow: 0 0 24px -6px rgba(242, 206, 22, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .artboard-desktop {
      width: 1440px;
      min-height: 900px;
      background:
        radial-gradient(60% 30% at 50% 0%, rgba(242, 206, 22, 0.065) 0%, transparent 70%),
        #08080A;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0px;
      display: flex;
      position: relative;
      flex-shrink: 0;
    }
    .artboard-desktop-fixed {
      height: 900px;
      overflow: hidden;
    }
    /* Custom static range slider look */
    .slider-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      background: #222228;
    }
    .slider-thumb {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: #F2CE16;
      border: 2px solid #08080A;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(242, 206, 22, 0.55);
    }
  </style>
</head>
<body class="p-12">

  <div class="w-[1440px] mx-auto">
    <div class="flex items-center justify-between mb-10 pb-5 border-b border-white/[0.08]">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-[2px] bg-vantage"></span>
        <h1 class="text-[14px] font-bold uppercase tracking-[0.18em] text-muted">
          Vantage Capital · Desktop Web App Artboards (1440px · All 8 Views)
        </h1>
      </div>
      <span class="text-[12px] font-medium text-faint tabular-nums">Static Figma Export · 0 Animations · Viewport 1536px</span>
    </div>

    <div id="desktop-artboards-stack" class="flex flex-col gap-16"></div>
  </div>

  <script>
    (function () {
      'use strict';

      let gradCounter = 0;

      const logoSVG = (w = 24, h = 18) => `
        <svg width="${w}" height="${h}" viewBox="0 0 221 167" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
          <path d="M0 0L110.109 166.858L127.539 141.473L32.7384 0C32.7384 0 0 0.242599 0 0Z" fill="#F2CE16"/>
          <path d="M110.109 101.493L127.545 76.2321L76.2324 0H43.2451L110.109 101.493Z" fill="#F2CE16"/>
          <path d="M115.195 44.7073L131.611 69.3921L177.767 0.487793H145.029L115.195 44.7073Z" fill="#F2CE16"/>
          <path d="M187.654 0L115.571 108.977L131.477 133.162L220.15 0H187.654Z" fill="#F2CE16"/>
          <path d="M109.937 21.7641C116.101 21.7641 121.098 16.8921 121.098 10.8821C121.098 4.87207 116.101 0 109.937 0C103.773 0 98.7759 4.87207 98.7759 10.8821C98.7759 16.8921 103.773 21.7641 109.937 21.7641Z" fill="#F2CE16"/>
        </svg>
      `;

      const sparkline = (pts) => {
        const min = Math.min(...pts), max = Math.max(...pts), r = max - min || 1;
        const coords = pts
          .map((p, i) => `${((i / (pts.length - 1)) * 68).toFixed(1)},${(20 - ((p - min) / r) * 16).toFixed(1)}`)
          .join(' ');
        return `<svg width="68" height="22" viewBox="0 0 68 22" fill="none" class="shrink-0 opacity-85"><polyline points="${coords}" fill="none" stroke="#F2CE16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      };

      const heroChartSVG = () => {
        const gid = `deskGrad-${++gradCounter}`;
        const labels = ['24 Oct', '29 Oct', '03 Nov', '08 Nov', '13 Nov', '17 Nov', '20 Nov', 'Hoy'];
        return `
          <div class="w-full flex flex-col gap-2">
            <div class="relative w-full h-[212px]">
              <div class="absolute inset-0 flex flex-col justify-between py-2">
                <div class="w-full border-t border-dashed border-white/[0.05]"></div>
                <div class="w-full border-t border-dashed border-white/[0.05]"></div>
                <div class="w-full border-t border-dashed border-white/[0.08]"></div>
              </div>
              <svg viewBox="0 0 1000 200" preserveAspectRatio="none" width="100%" height="100%" class="w-full h-full block">
                <defs>
                  <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#F2CE16" stop-opacity="0.22" />
                    <stop offset="100%" stop-color="#F2CE16" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <path d="M 0 180 C 120 155, 220 140, 350 118 C 480 95, 580 112, 700 68 C 820 28, 900 32, 1000 36 L 1000 200 L 0 200 Z" fill="url(#${gid})" />
                <path d="M 0 180 C 120 155, 220 140, 350 118 C 480 95, 580 112, 700 68 C 820 28, 900 32, 1000 36" fill="none" stroke="#F2CE16" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div style="left: 100%; top: 18%;" class="absolute -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full bg-vantage ring-[4px] ring-vantage/20"></div>
            </div>
            <div class="w-full flex items-center justify-between text-[11px] font-medium text-faint tabular-nums">
              ${labels.map((l) => `<span>${l}</span>`).join('')}
            </div>
          </div>
        `;
      };

      const desktopSidebar = (activeKey) => {
        const navItems = [
          { k: 'overview', icon: 'layout-dashboard', label: 'Resumen' },
          { k: 'transfer', icon: 'arrow-left-right', label: 'Transferencias' },
          { k: 'portfolio', icon: 'pie-chart', label: 'Portafolio' },
          { k: 'analytics', icon: 'activity', label: 'Analítica' },
          { k: 'cards', icon: 'credit-card', label: 'Tarjetas' },
          { k: 'settings', icon: 'sliders-horizontal', label: 'Ajustes' },
        ];
        return `
          <aside class="w-64 shrink-0 bg-surface border-r border-white/[0.07] p-5 flex flex-col justify-between">
            <div class="flex flex-col gap-7">
              <div class="flex items-center gap-3 px-1">
                ${logoSVG(24, 18)}
                <div class="flex flex-col">
                  <span class="text-[15px] font-bold tracking-tight text-ink leading-none">Vantage Capital</span>
                  <span class="text-[10px] font-bold uppercase tracking-[0.14em] text-vantage/85 mt-1 leading-none">Private Wealth</span>
                </div>
              </div>

              <nav class="flex flex-col gap-1">
                ${navItems.map((it) => {
                  const active = it.k === activeKey;
                  return `
                    <div class="flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-[14px] ${active ? 'font-bold bg-elevated text-ink hairline-gold shadow-[0_0_24px_-12px_rgba(242,206,22,0.45)]' : 'font-medium text-muted'}">
                      <span class="flex items-center gap-3"><i data-lucide="${it.icon}" class="w-4 h-4 shrink-0"></i><span>${it.label}</span></span>
                      ${active ? '<span class="w-1.5 h-1.5 rounded-full bg-vantage"></span>' : ''}
                    </div>
                  `;
                }).join('')}
              </nav>

              <div class="pt-4 border-t border-white/[0.06]">
                <div class="btn-glow w-full flex items-center justify-between px-3 py-3 rounded-xl">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-7 h-7 rounded-lg bg-vantage/15 border border-vantage/35 flex items-center justify-center text-vantage shrink-0">
                      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    </div>
                    <div class="flex flex-col min-w-0">
                      <span class="text-[13px] font-bold text-ink leading-tight">Copilot AI</span>
                      <span class="text-[11px] text-muted leading-tight">Analizar tesorería</span>
                    </div>
                  </div>
                  <span class="inline-flex items-center text-[10px] font-bold text-ink/70 bg-obsidian/70 hairline px-1.5 py-0.5 rounded-md shrink-0 leading-none">⌘K</span>
                </div>
              </div>

              <div class="bg-obsidian/70 hairline rounded-xl p-3 flex flex-col gap-2">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="text-muted font-medium">Custodia Tier-1</span>
                  <span class="inline-flex items-center gap-1 text-gain font-bold">
                    <span class="w-1.5 h-1.5 rounded-full bg-gain"></span>Activa
                  </span>
                </div>
                <div class="text-[11px] text-faint leading-snug">
                  FedNow, SEPA Instant y US Treasury T+1 operando sin demoras.
                </div>
              </div>
            </div>

            <div class="pt-4 border-t border-white/[0.06]">
              <div class="flex items-center gap-3 px-2 py-2 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-vantage/30 to-subtle hairline-gold flex items-center justify-center text-[11px] font-bold text-vantage shrink-0">AM</div>
                <div class="flex flex-col min-w-0 flex-1">
                  <span class="text-[13px] font-bold text-ink truncate">Alejandro Morales</span>
                  <span class="text-[11px] text-muted truncate">Private Wealth ••8841</span>
                </div>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-faint"></i>
              </div>
            </div>
          </aside>
        `;
      };

      const desktopHeader = (title) => `
        <header class="bg-obsidian/90 border-b border-white/[0.06] px-8 h-16 flex items-center justify-between gap-4 shrink-0">
          <div class="flex items-center gap-3 min-w-0">
            <h2 class="text-[16px] font-bold tracking-tight text-ink truncate">${title}</h2>
            <div class="flex items-center gap-4 ml-4 pl-4 border-l border-white/[0.08] text-[12px] tabular-nums">
              <span class="inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-muted">
                <span class="w-1.5 h-1.5 rounded-full bg-gain"></span>Live
              </span>
              <div class="flex items-center gap-1.5">
                <span class="text-muted">S&amp;P 500</span>
                <span class="text-ink font-semibold">5,846.80</span>
                <span class="text-gain font-medium">+0.42%</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-muted">US 3M</span>
                <span class="text-ink font-semibold">4.92%</span>
                <span class="text-vantage font-medium">APY</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-muted">EUR/USD</span>
                <span class="text-ink font-semibold">1.0800</span>
                <span class="text-faint">Mid</span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface hairline text-[12px] font-medium text-muted">
              <i data-lucide="smartphone" class="w-3.5 h-3.5 text-vantage"></i>
              <span>Vista App</span>
            </div>
            <div class="w-9 h-9 rounded-xl bg-surface hairline flex items-center justify-center text-muted">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </div>
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface hairline text-[12px] font-bold text-ink">
              <span class="w-1.5 h-1.5 rounded-full bg-vantage"></span>
              <span>Copilot</span>
            </div>
            <div class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-vantage text-obsidian text-[12px] font-bold shadow-[0_0_24px_-6px_rgba(242,206,22,0.55)]">
              <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[2.5]"></i>
              <span>Depositar</span>
            </div>
          </div>
        </header>
      `;

      const wrapDesktopArtboard = ({ label, activeNav, pageTitle, body, fixed = false, overlay = '' }) => `
        <div class="flex flex-col gap-3">
          <div class="flex items-center justify-between">
            <span class="text-[13px] font-bold text-ink/90 tracking-tight">${label}</span>
            <span class="text-[11px] font-mono text-faint">1440 × ${fixed ? '900' : 'auto'} px</span>
          </div>
          <div class="artboard-desktop ${fixed ? 'artboard-desktop-fixed' : ''}">
            ${desktopSidebar(activeNav)}
            <div class="flex-1 flex flex-col min-w-0">
              ${desktopHeader(pageTitle)}
              <main class="flex-1 w-full max-w-[1180px] mx-auto px-8 py-7 pb-10">
                ${body}
              </main>
            </div>
            ${overlay}
          </div>
        </div>
      `;

      // Reusable Overview Body (also used behind Copilot & Deposit Modal overlays)
      const overviewBody = () => `
        <div class="flex flex-col gap-6">
          <!-- Contextual Copilot Banner -->
          <div class="bg-gradient-to-r from-vantage/[0.08] via-surface to-surface hairline-gold rounded-2xl px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <span class="w-2 h-2 rounded-full bg-vantage shrink-0"></span>
              <p class="text-[13px] text-ink/90 truncate">
                <span class="font-bold text-ink">Vantage Copilot:</span> Rebalancear 5% de liquidez a Bonos del Tesoro añade <span class="text-vantage font-bold tabular-nums">+0.85% APY</span> manteniendo liquidez T+1.
              </p>
            </div>
            <div class="btn-glow px-3.5 py-1.5 rounded-xl text-[12px] font-bold shrink-0">Revisar con Copilot</div>
          </div>

          <!-- 4 KPI Cards -->
          <section class="grid grid-cols-4 gap-3.5 tabular-nums">
            <div class="bg-surface hairline rounded-2xl p-4 flex flex-col gap-1.5">
              <div class="flex items-center justify-between text-muted">
                <span class="text-[11px] font-medium uppercase tracking-wider">Rendimiento / Mes</span>
                <i data-lucide="trending-up" class="w-3.5 h-3.5 text-gain"></i>
              </div>
              <span class="text-[22px] font-bold text-ink">+$3,412</span>
              <span class="text-[11px] text-gain font-medium">Acreditado en T-Bills</span>
            </div>
            <div class="bg-surface hairline rounded-2xl p-4 flex flex-col gap-1.5">
              <div class="flex items-center justify-between text-muted">
                <span class="text-[11px] font-medium uppercase tracking-wider">APY Ponderado</span>
                <i data-lucide="percent" class="w-3.5 h-3.5 text-vantage"></i>
              </div>
              <span class="text-[22px] font-bold text-vantage">4.35%</span>
              <span class="text-[11px] text-muted">Liquidez inmediata T+1</span>
            </div>
            <div class="bg-surface hairline rounded-2xl p-4 flex flex-col gap-1.5">
              <div class="flex items-center justify-between text-muted">
                <span class="text-[11px] font-medium uppercase tracking-wider">Ahorro FX (YTD)</span>
                <i data-lucide="globe" class="w-3.5 h-3.5 text-vantage"></i>
              </div>
              <span class="text-[22px] font-bold text-ink">+$6,410</span>
              <span class="text-[11px] text-muted">0.00% spread institucional</span>
            </div>
            <div class="bg-surface hairline rounded-2xl p-4 flex flex-col gap-1.5">
              <div class="flex items-center justify-between text-muted">
                <span class="text-[11px] font-medium uppercase tracking-wider">Rieles Activos</span>
                <i data-lucide="zap" class="w-3.5 h-3.5 text-gain"></i>
              </div>
              <span class="text-[22px] font-bold text-ink">~15 seg</span>
              <span class="text-[11px] text-muted">FedNow · SEPA · USDC</span>
            </div>
          </section>

          <!-- Hero Balance & Chart -->
          <section class="hero-balance-surface hairline rounded-3xl p-6 flex flex-col gap-6">
            <div class="flex items-end justify-between gap-4">
              <div class="flex flex-col gap-1.5">
                <span class="text-[12px] font-bold uppercase tracking-wider text-muted">Balance Neto Total</span>
                <div class="flex items-baseline gap-2">
                  <div class="text-[46px] font-bold tracking-[-0.03em] leading-none tabular-nums text-ink">
                    $842,910<span class="text-muted text-[30px] font-medium">.45</span>
                  </div>
                  <span class="text-[13px] font-medium text-muted">USD</span>
                </div>
                <div class="flex items-center gap-2.5 mt-1 text-[13px] tabular-nums">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-md bg-gain/12 text-gain font-bold">+14.2%</span>
                  <span class="text-muted">+$104,820.00 <span class="text-faint">últimos 30d</span></span>
                  <span class="text-faint">·</span>
                  <span class="text-muted">Máx. <span class="text-ink font-medium">$847,361</span></span>
                </div>
              </div>
              <div class="inline-flex items-center bg-obsidian/90 p-1 rounded-xl hairline text-[12px] font-bold tabular-nums">
                <span class="px-3.5 py-1.5 text-muted">1D</span>
                <span class="px-3.5 py-1.5 text-muted">1W</span>
                <span class="px-3.5 py-1.5 rounded-lg bg-elevated text-vantage hairline-gold">1M</span>
                <span class="px-3.5 py-1.5 text-muted">1Y</span>
                <span class="px-3.5 py-1.5 text-muted">ALL</span>
              </div>
            </div>

            ${heroChartSVG()}

            <div class="grid grid-cols-4 gap-3 pt-4 border-t border-white/[0.06]">
              <div class="flex items-center justify-center gap-2.5 px-4 py-3 rounded-xl bg-vantage text-obsidian font-bold text-[13px] shadow-[0_0_24px_-6px_rgba(242,206,22,0.55)]">
                <i data-lucide="arrow-down-left" class="w-4 h-4 stroke-[2.25]"></i><span>Depositar</span>
              </div>
              <div class="flex items-center justify-center gap-2.5 px-4 py-3 rounded-xl bg-elevated hairline text-ink font-bold text-[13px]">
                <i data-lucide="arrow-up-right" class="w-4 h-4 text-vantage"></i><span>Enviar</span>
              </div>
              <div class="flex items-center justify-center gap-2.5 px-4 py-3 rounded-xl bg-elevated hairline text-ink font-bold text-[13px]">
                <i data-lucide="refresh-cw" class="w-4 h-4 text-muted"></i><span>Cambiar FX</span>
              </div>
              <div class="flex items-center justify-center gap-2.5 px-4 py-3 rounded-xl bg-elevated hairline text-ink font-bold text-[13px]">
                <i data-lucide="bar-chart-2" class="w-4 h-4 text-muted"></i><span>Analítica</span>
              </div>
            </div>
          </section>

          <!-- 4 Multi-Currency Accounts -->
          <section class="flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <h3 class="text-[14px] font-bold text-ink tracking-tight">Cuentas Multi-Divisa</h3>
              <span class="text-[12px] font-bold text-vantage">Mover fondos →</span>
            </div>
            <div class="grid grid-cols-4 gap-3.5 tabular-nums">
              ${[
                { c: 'USD', apy: '4.85% APY', bal: '$324,500.00', lbl: 'Treasury Account', mask: '••8841', sp: [14,16,15,19,22,25,28] },
                { c: 'EUR', apy: '3.40% APY', bal: '€148,200.00', lbl: 'SEPA Liquidity', mask: '••2094', sp: [18,17,19,20,21,22,24] },
                { c: 'GBP', apy: '4.60% APY', bal: '£62,400.00', lbl: 'UK Reserve', mask: '••5112', sp: [12,13,14,14,16,17,19] },
                { c: 'USDC', apy: '5.10% APY', bal: '$54,120.45', lbl: 'Digital Settlement', mask: '0x94…e2', sp: [10,14,15,18,21,24,27] },
              ].map((acc) => `
                <div class="bg-surface hairline rounded-2xl p-4 flex flex-col gap-3">
                  <div class="flex items-center justify-between w-full">
                    <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-elevated hairline text-ink">${acc.c}</span>
                    <span class="text-[11px] font-bold text-gain">${acc.apy}</span>
                  </div>
                  <div class="flex items-end justify-between gap-2 w-full">
                    <div class="flex flex-col gap-0.5 min-w-0">
                      <span class="text-[19px] font-bold text-ink tracking-tight truncate">${acc.bal}</span>
                      <span class="text-[11px] text-muted truncate">${acc.lbl} <span class="text-faint">${acc.mask}</span></span>
                    </div>
                    ${sparkline(acc.sp)}
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- Recent Activity Table -->
